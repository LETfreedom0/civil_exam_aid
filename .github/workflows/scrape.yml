name: scrape

# 残疾人公考岗位采集流水线
# 文档方案：GitHub Actions 定时采集 → 解析 → upsert Supabase → run_log 记录

on:
  schedule:
    # UTC 22:00 = 北京时间每天 06:00
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只校验配置与数据源连通性，不写入 Supabase"
        required: false
        default: "true"

permissions:
  contents: read

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      SB_URL: ${{ secrets.SB_URL }}
      SB_SERVICE_KEY: ${{ secrets.SB_SERVICE_KEY }}
      SB_TABLE: positions

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: 安装依赖
        run: pip install -r scripts/requirements.txt

      - name: 运行采集
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            python scripts/scrape.py --dry-run
          else
            python scripts/scrape.py
          fi

      - name: 失败告警提示
        if: failure()
        run: |
          echo "::error::采集失败。请检查：1) 仓库 Settings → Secrets 是否已配置 SB_URL / SB_SERVICE_KEY；2) 数据源站点是否改版（scripts/sources.yaml）；3) Actions 日志中各步骤输出。"
