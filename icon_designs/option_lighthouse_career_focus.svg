<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="oceanNight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#141E30;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#243B55;stop-opacity:1" />
    </linearGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect x="0" y="0" width="200" height="200" rx="40" fill="url(#oceanNight)" />
  
  <!-- Lighthouse on Left -->
  <path d="M40,180 L50,60 L70,60 L80,180 Z" fill="#E0E0E0" />
  <rect x="48" y="50" width="24" height="12" fill="#E74C3C" />
  <circle cx="60" cy="56" r="6" fill="#FFD700" filter="url(#softGlow)" />
  
  <!-- Beam -->
  <path d="M60,60 L190,40 L190,160 Z" fill="url(#beamGradient)" opacity="0.3" />
  <linearGradient id="beamGradient" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#FFD700;stop-opacity:0" />
  </linearGradient>
  
  <!-- Target Area: Illuminated Circle -->
  <circle cx="135" cy="110" r="55" fill="rgba(255, 255, 255, 0.1)" />
  
  <!-- Wheelchair + 职 Symbol -->
  <g transform="translate(95, 70) scale(0.9)">
      <!-- Wheelchair Person (White) -->
      <g fill="#FFFFFF">
          <circle cx="20" cy="10" r="8" /> <!-- Head -->
          <path d="M20,22 L20,50 L50,50 L50,42 L28,42 L28,22 Z" /> <!-- Body & Leg -->
          <rect x="28" y="22" width="20" height="8" rx="2" /> <!-- Arm -->
          <path d="M25,50 A 18,18 0 1,1 25,14" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" transform="rotate(-15 25 50)"/> <!-- Wheel -->
      </g>
      
      <!-- Character '职' (Gold/Yellow to highlight Career) -->
      <text x="65" y="35" font-family="'Microsoft YaHei', sans-serif" font-weight="bold" font-size="36" fill="#FFD700">职</text>
  </g>
  
</svg>