<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="compassGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E0EAFC;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#CFDEF3;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <circle cx="100" cy="100" r="90" fill="url(#compassGradient)" stroke="#5B86E5" stroke-width="8" />
  
  <!-- Ticks -->
  <path d="M100,20 L100,30 M100,170 L100,180 M20,100 L30,100 M170,100 L180,100" stroke="#5B86E5" stroke-width="4" />
  
  <!-- Needle (Pen Nib Shape) -->
  <g transform="rotate(45 100 100)">
      <!-- North/Tip -->
      <path d="M100,40 L120,100 L100,100 Z" fill="#FF4B2B" />
      <path d="M100,40 L80,100 L100,100 Z" fill="#FF416C" />
      
      <!-- South/Tail -->
      <path d="M100,160 L120,100 L100,100 Z" fill="#999" />
      <path d="M100,160 L80,100 L100,100 Z" fill="#777" />
      
      <!-- Center Pin -->
      <circle cx="100" cy="100" r="6" fill="white" stroke="#5B86E5" stroke-width="2"/>
  </g>
</svg>