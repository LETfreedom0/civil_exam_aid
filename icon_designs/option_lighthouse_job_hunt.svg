<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="hopeSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1c92d2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f2fcfe;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect x="0" y="0" width="200" height="200" rx="40" fill="url(#hopeSky)" />
  
  <!-- Large "职" Character as Background Structure -->
  <text x="140" y="150" font-family="'Microsoft YaHei', sans-serif" font-weight="bold" font-size="120" fill="white" opacity="0.3" text-anchor="middle">职</text>
  
  <!-- Lighthouse -->
  <path d="M30,180 L45,40 L65,40 L80,180 Z" fill="#FFFFFF" filter="url(#shadow)"/>
  <rect x="42" y="30" width="26" height="14" fill="#E74C3C" />
  <circle cx="55" cy="37" r="8" fill="#FFD700" />
  
  <!-- Spotlight Beam -->
  <path d="M55,37 L100,80 L180,160 L120,180 Z" fill="rgba(255, 235, 59, 0.4)" />
  
  <!-- Wheelchair Symbol in the Spotlight (Highlighted) -->
  <g transform="translate(100, 100) scale(1.0)" filter="url(#shadow)">
      <g fill="#2980b9">
          <circle cx="20" cy="5" r="8" />
          <path d="M18,18 L18,50 L50,50 L50,40 L28,40 L28,18 Z" />
          <circle cx="24" cy="50" r="16" stroke="#2980b9" stroke-width="6" fill="none" />
      </g>
      <!-- Briefcase Symbol to emphasize "Job Seeking" -->
      <rect x="45" y="35" width="20" height="16" rx="2" fill="#e67e22" />
      <path d="M52,35 L52,30 Q55,28 58,30 L58,35" stroke="#e67e22" stroke-width="2" fill="none" />
  </g>
  
</svg>