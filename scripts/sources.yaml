  # ==================================================================
  # 上海市 2027 年度考试录用公务员（2026-10-30 发布）
  #   站点:   shacs.gov.cn 是 Vue 单页应用，页面 HTML 里没有正文和附件。
  #           数据来自 JSON 接口，base = https://shacs.gov.cn/gwyj/api
  #             /gwy-column-section.json?listChild=true   → 栏目（440 = 2027 专题）
  #             /child-section-and-news.json?sectionId=440 → 专题下各栏目文章
  #             /show-news.json?id=1465                   → 文章详情，带 attIds/attNames
  #           附件下载: https://shacs.gov.cn/gwyj/api/files/fetch?fid=<attId>
  #           该链接无扩展名（parse_attachment 按文件头识别，已支持）
  #   附件:   招考简章 .xls，9 个 sheet（公务员/参公/行政执法/服务基层项目/
  #           市外办非通用语/公安机关特警/残疾人/警务技术类人民警察/
  #           高校毕业生退役士兵），每张表前两行都是标题与说明 → 表头在第 3 行
  #   注意:   sheet 是「招录类别」不是城市 → sheet_as_city: false
  #           三张专项表的「招考对象」列写的是「不限」，群体口径只体现在
  #           sheet 名上 → 用 sheet_identity_map 显式指定
  #           专业要求分「本科/研究生」两列 → 都映射到 major（自动用；拼接）
  #           直辖市无下级城市，city 留空（与北京/天津一致）
  # ==================================================================
