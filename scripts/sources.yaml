  #           专业要求分「研究生/本科/大专」三列，全部映射到 major（自动用；拼接）
  # ------------------------------------------------------------------
  - id: gd-rsks-2027
    province_code: "440000"
    name: 广东组织工作网·2027年度公务员
    kind: announcement
