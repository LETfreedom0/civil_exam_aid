  #           面向残疾人职位 14 条，残疾类别与等级写在「其它条件」列
  # ------------------------------------------------------------------
  - id: bj-rsks-2027
    province_code: "110000"
    name: 北京市人事考试通用平台·2027年度公务员
    kind: announcement
    enabled: true
    year: 2027
    category: 0
    list_url: https://www.beijing.gov.cn/gongkai/rsxx/gwyzk/202611/t20261109_4938196.html
    announcement_title: 北京市各级机关2027年度考试录用公务员公告
    header_row: 1
    sheet_as_city: false
    sheet_identity: true
    field_mapping:
      职位代码: position_code
      单位名称: recruit_unit
      用人部门: region_dept
      机构性质: position_nature
      职位名称: position_name
      职位层级: unit_level
      职位类别: position_type
      职位简介: description
      招考人数: quota
      学历要求: education
      学位要求: degree
      专业要求: major
      政治面貌: political_status
      其它条件: other_requirements        # 含残疾类别等级、资格证书等硬条件
